services:
  game:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3100
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: https://${DOMAIN:?Imposta DOMAIN nel file .env}
      PERSISTENCE: sqlite
      AUTH_REQUIRED: "true"
      TRUST_PROXY: "true"
      GAME_PROFILE: live
    volumes:
      - game-data:/app/data
    expose:
      - "3100"
    stop_grace_period: 15s
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Imposta DOMAIN nel file .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - game
volumes:
  game-data:
  caddy-data:
  caddy-config:
